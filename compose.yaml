services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ear
      POSTGRES_USER: ear
      POSTGRES_PASSWORD: ear_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ear -d ear"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ear_postgres_data:/var/lib/postgresql/data

volumes:
  ear_postgres_data:
