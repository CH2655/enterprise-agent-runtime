services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ear
      POSTGRES_USER: ear
      POSTGRES_PASSWORD: ear_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ear -d ear"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ear_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - ear_qdrant_data:/qdrant/storage

volumes:
  ear_postgres_data:
  ear_qdrant_data:
